<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — HarmonyAI</title>
<meta name="robots" content="noindex">
<meta name="description" content="Такой страницы на HarmonyAI нет. Вернитесь на главную или откройте чат.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d0f14'/%3E%3Cpath d='M18 14h8v18h12V14h8v36h-8V39H26v11h-8z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/site.css">
<style>
/* ===== СТРАНИЦА 404 =====
   Отдельный блок стилей вместо новой секции в site.css: страница одна,
   а её разметка нигде больше не повторяется. Двигаем только transform
   и opacity — то же правило, что и во всей витрине. */
.nf{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:48px 22px;
  position:relative;overflow:hidden;
}
/* Мягкое пятно на фоне: чистый CSS, без картинок и лишних запросов. */
.nf::before{
  content:"";position:absolute;z-index:0;
  width:min(760px,120vw);aspect-ratio:1;
  background:radial-gradient(circle,rgba(31,111,235,.10),rgba(31,111,235,0) 62%);
  top:-22%;left:50%;transform:translateX(-50%);
  pointer-events:none;
}
.nf-inner{position:relative;z-index:1;max-width:600px;width:100%;}

.nf-code{
  font-size:clamp(96px,22vw,190px);
  line-height:.92;font-weight:800;letter-spacing:-.05em;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:.06em;
}
/* Ноль — это пауза в нотной записи: музыкальный акцент вместо простой цифры. */
.nf-rest{
  width:.62em;height:.62em;flex:0 0 auto;
  border-radius:50%;
  border:.11em solid var(--text);
  position:relative;
  animation:nfPulse 2.6s var(--ease) infinite;
}
.nf-rest::after{
  content:"";position:absolute;inset:.13em;
  border-radius:50%;background:var(--text);
  transform:scale(.34);
}
@keyframes nfPulse{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(.93);opacity:.72;}
}

.nf-eyebrow{
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:18px;
}
.nf h1{
  font-size:clamp(23px,4.4vw,31px);
  font-weight:700;letter-spacing:-.02em;
  margin:22px 0 12px;
}
.nf p.nf-lead{
  font-size:17px;color:var(--text-2);
  max-width:460px;margin:0 auto 30px;
}
.nf-path{
  display:inline-block;max-width:100%;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;color:var(--text-2);
  background:var(--code-bg);border:1px solid var(--border);
  border-radius:999px;padding:5px 14px;margin-bottom:26px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nf-actions{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;}

/* Куда пойти дальше — вместо тупика показываем реальные разделы. */
.nf-links{
  margin-top:44px;padding-top:26px;
  border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;
  font-size:15px;
}
.nf-links a{color:var(--text-2);transition:color var(--anim-in) var(--ease);}
.nf-links a:hover{color:var(--text);}

/* Появление: один короткий заход, без каскада задержек. */
.nf-inner{animation:nfIn 380ms var(--ease) both;}
@keyframes nfIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

@media(prefers-reduced-motion:reduce){
  .nf-inner,.nf-rest{animation:none;}
}
</style>
</head>
<body>

<main class="nf" id="main">
  <div class="nf-inner">
    <p class="nf-eyebrow">Ошибка 404</p>

    <div class="nf-code" aria-hidden="true">
      4<span class="nf-rest"></span>4
    </div>

    <h1>Здесь пауза — страницы нет</h1>
    <p class="nf-lead">
      Адрес не существует или раздел переехал. Ничего не потеряно:
      чат и все ваши переписки на месте.
    </p>

    <p class="nf-path" id="nfPath" hidden></p>

    <div class="nf-actions">
      <a class="btn btn-primary btn-lg" href="/">На главную</a>
      <a class="btn btn-outline btn-lg" href="/chat">Открыть чат&nbsp;→</a>
    </div>

    <nav class="nf-links" aria-label="Разделы сайта">
      <a href="/api">API</a>
      <a href="/#pricing">Цены</a>
      <a href="/help">Частые вопросы</a>
      <a href="/about">О нас</a>
      <a href="/contacts">Контакты</a>
    </nav>
  </div>
</main>

<script>
/* Показываем адрес, по которому человек пришёл: так понятнее, что именно
   не найдено. Вставляем через textContent — строка из URL не должна
   попасть в разметку как HTML. */
(function () {
  try {
    var el = document.getElementById('nfPath');
    var path = (location.pathname || '') + (location.search || '');
    if (!el || !path || path === '/') return;
    if (path.length > 96) path = path.slice(0, 95) + '…';
    el.textContent = path;
    el.hidden = false;
  } catch (e) {}
})();
</script>

</body>
</html>
